<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add or Update Celebrity - Admin Panel</title>
    <meta name="description" content="Admin panel to add or update celebrity profiles for Celebrity Blog.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: #f8f9fa;
        }

        .sidebar {
            background: #fff;
            border-right: 1px solid #dee2e6;
            min-height: 100vh;
            position: sticky;
            top: 0;
        }

        .btn-primary,
        .bg-primary {
            background: #d11e5a !important;
            border: #d11e5a;
        }

        .text-primary {
            color: #d11e5a !important;
        }

        .bi {
            color: #d11e5a !important;
        }

        .nav-link {
            color: #d11e5a !important;
        }

        .nav-link.active,
        .sidebar .nav-link.active {
            background: #e9ecef;
            font-weight: bold;
            color: #d11e5a;
        }

        .form-section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #d11e5a;
        }

        .form-card {
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .profile-img-preview {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #d11e5a;
            margin-bottom: 1rem;
        }

        .cover-img-preview {
            width: 500px;
            height: 200px;
            object-fit: cover;
            margin-bottom: 1rem;
        }

        .required:after {
            content: "*";
            color: #d11e5a;
            margin-left: 2px;
        }

        .close-btn {
            display: none;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                width: 260px;
                position: fixed;
                top: 0;
                left: 0;
                z-index: 9999;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
                transition: margin-left 0.3s ease;
            }

            .sidebar.hide {
                margin-left: -260px !important;
            }

            .close-btn {
                display: flex;
            }
        }

        @media (max-width: 767.98px) {

            .profile-img-preview {
                width: 80px;
                height: 80px;
            }

            .cover-img-preview {
                width: 100%;
                height: 100px;
            }

            .form-section-title {
                font-size: 1.1rem;
            }
        }

        .tag-input {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: #e9ecef;
            color: #d11e5a;
            border-radius: 20px;
            padding: 0.2rem 0.8rem;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
        }

        .tag .remove-tag {
            margin-left: 0.5rem;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .input-group-text {
            background: #f8f9fa;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control:focus {
            border-color: #d11e5a;
            box-shadow: 0 0 0 0.2rem rgba(209, 30, 90, .15);
        }

        .alert-success,
        .alert-danger {
            margin-top: 1rem;
        }

        .form-footer {
            border-top: 1px solid #dee2e6;
            padding-top: 1.5rem;
            margin-top: 2rem;
        }

        input {
            min-width: 60px;
            border: 1px solid #ccc;
            padding: 2px 4px;
            font-size: 14px;
            transition: width 0.2s ease;
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            vertical-align: top;
        }

        textarea {
            width: 100%;
            /* expands to container */
            min-height: 30px;
            resize: none;
            overflow: hidden;
            font-size: 14px;
            padding: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="/admin/"><i class="bi bi-chevron-left"></i> Admin
                Home</a>
        </div>
    </nav>
    <div class="">
        <div class="rows">
            <!-- Main Content -->
            <main class="col-lg-12 col-md-12 px-0 pb-4">
                <form id="celebrityForm" class="px-0 px-md-0" enctype="multipart/form-data" autocomplete="off">
                    <h1 class="fw-bold mx-3 mb-3 text-primary" id="formTitle">Add Celebrity</h1>
                    <div id="formAlert"></div>
                    <!-- Basic Info -->
                    <section id="basic" class="form-card card mb-4">
                        <div class="card-body">
                            <div class="form-section-title"><i class="bi bi-person-circle"></i> Basic Info</div>
                            <div class="g-3">
                                <div class=" text-center">
                                    <img src="https://via.placeholder.com/120x120.png?text=Photo" alt="Profile Preview"
                                        onclick="document.getElementById('ProfileImage').click()"
                                        class="profile-img-preview" id="profileImgPreview">
                                    <div class="my-2">
                                        <input type="text" class="form-control" id="profilePic" name="profilePic"
                                            placeholder="https://example.com/photo.jpg">
                                        <small class="text-muted">profile photo</small>
                                    </div>
                                    <input hidden class="form-control" type="file" id="ProfileImage" name="image"
                                        onchange="previewImage(event)" accept="image/*">
                                </div>
                                <div class="text-center">
                                    <div class="my-2">
                                        <input type="text" class="form-control text-info" id="link" name="link"
                                            placeholder="https://....e.g instagram, tiktok">
                                        <small class="text-muted">Link To profile</small>
                                    </div>
                                </div>
                                <div class="text-center">
                                    <img src="https://via.placeholder.com/120x120.png?text=Photo" alt="Cover Preview"
                                        class="cover-img-preview" id="coverImgPreview">
                                    <div class="mt-2">
                                        <input type="text" class="form-control" id="coverPic" name="coverPic"
                                            placeholder="https://example.com/photo.jpg">
                                        <small class="text-muted">cover photo</small>
                                    </div>
                                </div>
                                <div class="">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label required" for="fullName">Full Name</label>
                                            <input type="text" class="form-control" id="fullName" name="fullName"
                                                required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="stageName">Stage Name / Nickname</label>
                                            <input type="text" class="form-control" id="stageName" name="stageName">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label required" for="dateOfBirth">Date of Birth</label>
                                            <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth"
                                                required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="placeOfBirth">Place of Birth</label>
                                            <input type="text" class="form-control" id="placeOfBirth"
                                                name="placeOfBirth">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label" for="nationality">Nationality</label>
                                            <input type="text" class="form-control" id="nationality" name="nationality">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label required" for="profession">Profession(s)</label>
                                            <input type="text" class="form-control" id="profession" name="profession"
                                                placeholder="e.g. Singer, Actor" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label" for="bio">Short Bio</label>
                                            <textarea class="form-control" id="bio" name="bio" rows="3"></textarea>
                                            <small class="text-muted">Max 400 characters</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <!-- Career -->
                    <section id="career" class="form-card card mb-4">
                        <div class="card-body">
                            <div class="form-section-title"><i class="bi bi-graph-up-arrow"></i> Career</div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="careerBackground">Career Background</label>
                                    <textarea class="form-control" id="careerBackground" name="careerBackground"
                                        rows="2"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="careerStatus">Current Status</label>
                                    <input type="text" class="form-control" id="careerStatus" name="careerStatus"
                                        placeholder="e.g. Active, Retired">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="careerStart">How It Started</label>
                                    <textarea class="form-control" id="careerStart" name="careerStart"
                                        rows="2"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="careerBreakthrough">Breakthrough Moment</label>
                                    <textarea class="form-control" id="careerBreakthrough" name="careerBreakthrough"
                                        rows="2"></textarea>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="careerAchievements">Notable Achievements</label>
                                    <div class="tag-input" id="careerAchievementsInput"></div>

                                    <div class="row g-2 align-items-end mt-2">
                                        <div class="col-md-3">
                                            <input type="number" class="form-control" id="careerAchievementYear"
                                                placeholder="Year">
                                        </div>
                                        <div class="col-md-3">
                                            <input type="text" class="form-control" id="careerAchievementTitle"
                                                placeholder="Title">
                                        </div>
                                        <div class="col-md-4">
                                            <textarea class="form-control" id="careerAchievementDesc"
                                                placeholder="Description"></textarea>
                                        </div>
                                        <div class="col-md-2">
                                            <button type="button" class="btn btn-outline-primary w-100"
                                                id="addAchievement">
                                                <i class="bi bi-plus"></i> Add
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Hidden input for form submission -->
                                    <input type="hidden" id="careerAchievements" name="careerAchievements">
                                </div>


                                <div class="col-12">
                                    <label class="form-label" for="careerTimeline">Career Timeline</label>
                                    <div id="careerTimelineInputs"></div>
                                    <div class="row g-2 align-items-end mt-2">
                                        <div class="col-4">
                                            <input type="number" class="form-control" id="timelineYear"
                                                placeholder="Year">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" class="form-control" id="timelineTitle"
                                                placeholder="Title">
                                        </div>
                                        <div class="col-6">
                                            <textarea name="timelineEvent" type="text" class="form-control"
                                                id="timelineEvent" placeholder="Event"></textarea>
                                        </div>
                                        <div class="col-2">
                                            <button type="button" class="btn btn-outline-primary w-100"
                                                id="addTimeline"><i class="bi bi-plus"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <!-- Works -->
                    <section id="works" class="form-card card mb-4">
                        <div class="card-body">
                            <div class="form-section-title"><i class="bi bi-star-fill"></i> Major Works / Projects</div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="albums">Albums / Songs / Movies</label>
                                    <div id="albumsInput"></div>
                                    <div class="row g-2 align-items-end mt-2">
                                        <div class="col-7">
                                            <input type="text" class="form-control" id="albumTitle" placeholder="Title">
                                        </div>
                                        <div class="col-7">
                                            <input type="text" class="form-control" id="albumUrl" placeholder="url">
                                        </div>
                                        <div class="col-7">
                                            <input type="text" class="form-control" id="albumDescription"
                                                placeholder="description">
                                        </div>
                                        <div class="col-3">
                                            <input type="number" class="form-control" id="albumYear" placeholder="Year">
                                        </div>
                                        <div class="col-2">
                                            <button type="button" class="btn btn-outline-primary w-100" id="addAlbum"><i
                                                    class="bi bi-plus"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="concerts">Major Concerts / Shows</label>
                                    <div id="concertsInput"></div>
                                    <div class="row g-2 align-items-end mt-2">
                                        <div class="col-7">
                                            <input type="text" class="form-control" id="concertName" placeholder="Name">
                                        </div>
                                        <div class="col-7">
                                            <input type="text" class="form-control" id="concertDesc"
                                                placeholder="Description">
                                        </div>
                                        <div class="col-3">
                                            <input type="number" class="form-control" id="concertYear"
                                                placeholder="Year">
                                        </div>
                                        <div class="col-2">
                                            <button type="button" class="btn btn-outline-primary w-100"
                                                id="addConcert"><i class="bi bi-plus"></i></button>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label mt-3" for="brands">Businesses / Brands</label>
                                        <div id="brandsInput" class="mb-3"></div>

                                        <div class="row g-2 align-items-end">
                                            <div class="col-md-4">
                                                <input type="text" class="form-control" id="brandName"
                                                    placeholder="Brand Name">
                                            </div>
                                            <div class="col-md-3">
                                                <input type="number" class="form-control" id="brandYear"
                                                    placeholder="Year Started">
                                            </div>
                                            <div class="col-md-3">
                                                <textarea class="form-control" id="brandDescription"
                                                    placeholder="Description"></textarea>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="button" class="btn btn-outline-primary w-100"
                                                    id="addBrandBtn">
                                                    <i class="bi bi-plus"></i> Add
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Hidden input to hold JSON data for form -->
                                        <input type="hidden" id="brands" name="brands">
                                    </div>


                                </div>
                            </div>
                        </div>
                    </section>
                    <!-- Awards -->
                    <section id="awards" class="form-card card mb-4">
                        <div class="card-body">
                            <div class="form-section-title"><i class="bi bi-trophy-fill"></i> Awards & Recognition</div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="awardsList">Awards</label>
                                    <div id="awardsInput"></div>
                                    <div class="row g-2 align-items-end mt-2">
                                        <div class="col-7">
                                            <input type="text" class="form-control" id="awardName"
                                                placeholder="Award Name">
                                        </div>
                                        <div class="col-7">
                                            <input type="text" class="form-control" id="awardDesc"
                                                placeholder="Award Description">
                                        </div>
                                        <div class="col-3">
                                            <input type="number" class="form-control" id="awardYear" placeholder="Year">
                                        </div>
                                        <div class="col-2">
                                            <button type="button" class="btn btn-outline-primary w-100" id="addAward"><i
                                                    class="bi bi-plus"></i></button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="col-12">
                                        <label class="form-label mt-3" for="nominations">Nominations / Honorary
                                            Titles</label>
                                        <div id="nominationsInput" class="mb-3"></div>

                                        <div class="row g-2 align-items-end">
                                            <div class="col-md-5">
                                                <input type="text" class="form-control" id="nominationTitle"
                                                    placeholder="Title (e.g., Best Actor)">
                                            </div>
                                            <div class="col-md-5">
                                                <textarea class="form-control" id="nominationDesc"
                                                    placeholder="Description or reason"></textarea>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="button" class="btn btn-outline-primary w-100"
                                                    id="addNominationBtn">
                                                    <i class="bi bi-plus"></i> Add
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Hidden input for backend -->
                                        <input type="hidden" id="nominations" name="nominations">
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label mt-3" for="records">Records Set / Broken</label>
                                        <div id="recordsInput" class="mb-3"></div>

                                        <div class="row g-2 align-items-end">
                                            <div class="col-md-5">
                                                <input type="text" class="form-control" id="recordTitle"
                                                    placeholder="Record Title">
                                            </div>
                                            <div class="col-md-5">
                                                <textarea class="form-control" id="recordDesc"
                                                    placeholder="Description of the record"></textarea>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="button" class="btn btn-outline-primary w-100"
                                                    id="addRecordBtn">
                                                    <i class="bi bi-plus"></i> Add
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Hidden input for form submission -->
                                        <input type="hidden" id="records" name="records">
                                    </div>

                                </div>
                                <div class="col-12">
                                    <label class="form-label mt-3" for="awardGallery">Award Gallery (Image URLs)</label>
                                    <div id="awardGalleryInput" class="mb-3"></div>

                                    <div class="row g-2 align-items-end">
                                        <div class="col-md-6">
                                            <input type="url" class="form-control" id="awardImageUrl"
                                                placeholder="Image URL">
                                        </div>
                                        <div class="col-md-4">
                                            <input type="text" class="form-control" id="awardImageCaption"
                                                placeholder="Caption">
                                        </div>
                                        <div class="col-md-2">
                                            <button type="button" class="btn btn-outline-primary w-100"
                                                id="addAwardImageBtn">
                                                <i class="bi bi-plus"></i> Add
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Hidden input for storing JSON -->
                                    <input type="hidden" id="awardGallery" name="awardGallery">
                                </div>

                            </div>
                        </div>
                    </section>
                    <!-- Personal Life -->
                    <section id="personal" class="form-card card mb-4">
                        <div class="card-body">
                            <div class="form-section-title"><i class="bi bi-heart-fill"></i> Personal Life</div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="relationshipStatus">Relationship Status</label>
                                    <input type="text" class="form-control" id="relationshipStatus"
                                        name="relationshipStatus">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="children">Children</label>
                                    <input type="text" class="form-control" id="children" name="children">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="family">Family Background</label>
                                    <input type="text" class="form-control" id="family" name="family">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="friends">Close Friendships / Collaborations</label>
                                    <input type="text" class="form-control" id="friends" name="friends">
                                </div>
                                <div class="col-12">
                                    <label class="form-label mt-3" for="personalInsights">Publicly Shared
                                        Insights</label>
                                    <div id="personalInsightsList" class="mb-3"></div>

                                    <div class="row g-2 align-items-end">
                                        <div class="col-md-5">
                                            <input type="text" class="form-control" id="insightTitle"
                                                placeholder="Insight Title">
                                        </div>
                                        <div class="col-md-5">
                                            <textarea class="form-control" id="insightDesc"
                                                placeholder="Insight Description"></textarea>
                                        </div>
                                        <div class="col-md-2">
                                            <button type="button" class="btn btn-outline-primary w-100"
                                                id="addInsightBtn">
                                                <i class="bi bi-plus"></i> Add
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Hidden input for form submission -->
                                    <input type="hidden" id="personalInsights" name="personalInsights">
                                </div>

                            </div>
                        </div>
                    </section>
                    <!-- Net Worth -->
                    <section id="networths" class="form-card card mb-4">
                        <div class="card-body">
                            <div class="form-section-title"><i class="bi bi-cash-stack"></i> Net Worth / Lifestyle</div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label" for="networth">Estimated Net Worth (in Dollars)</label>
                                    <input type="number" class="form-control" id="networth" name="networth" min="0"
                                        step="0.01">
                                </div>
                                <div class="col-12">
                                    <label class="form-label mt-3" for="assets">Assets</label>
                                    <div id="assetsList" class="mb-3"></div>

                                    <div class="row g-2 align-items-end">
                                        <div class="col-md-6">
                                            <input type="text" class="form-control" id="assetName"
                                                placeholder="Asset Name (e.g., Private Jet)">
                                        </div>
                                        <div class="col-md-4">
                                            <input type="number" class="form-control" id="assetWorth"
                                                placeholder="Estimated Worth">
                                        </div>
                                        <div class="col-md-2">
                                            <button type="button" class="btn btn-outline-primary w-100"
                                                id="addAssetBtn">
                                                <i class="bi bi-plus"></i> Add
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Hidden input for backend submission -->
                                    <input type="hidden" id="assets" name="assets">
                                </div>

                                <div class="col-12">
                                    <label class="form-label mt-3" for="philanthropy">Philanthropy</label>
                                    <div id="philanthropyInput" class="mb-3"></div>

                                    <div class="row g-2 align-items-end">
                                        <div class="col-md-5">
                                            <input type="text" class="form-control" id="philanthropyTitle"
                                                placeholder="Philanthropy Title (e.g., Cancer Relief Fund)">
                                        </div>
                                        <div class="col-md-5">
                                            <textarea class="form-control" id="philanthropyDesc"
                                                placeholder="Description or contribution details"></textarea>
                                        </div>
                                        <div class="col-md-2">
                                            <button type="button" class="btn btn-outline-primary w-100"
                                                id="addPhilanthropyBtn">
                                                <i class="bi bi-plus"></i> Add
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Hidden input for form submission -->
                                    <input type="hidden" id="philanthropy" name="philanthropy">
                                </div>

                            </div>
                        </div>
                    </section>
                    <!-- News -->
                    <section id="news" class="form-card card mb-4">
                        <div class="card-body">
                            <div class="form-section-title"><i class="bi bi-newspaper"></i> Recent News / Trends</div>
                            <label class="form-label" for="newsList">Latest Updates</label>
                            <div class="tag-input" id="newsInput"></div>
                            <input type="text" class="form-control mt-2" id="newsList"
                                placeholder="Type and press Enter">
                        </div>
                    </section>
                    <!-- Fun Facts -->

        // Tag input helpers
        function tagInput(inputId, containerId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(containerId);
            let tags = [];
            input.addEventListener('keydown', function (e) {
                if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) {
                    e.preventDefault();
                    addTag(input.value.trim());
                    input.value = '';
                }
            });
            function addTag(val) {
                if (val && !tags.includes(val)) {
                    tags.push(val);
                    render();
                }
            }
            function removeTag(idx) {
                tags.splice(idx, 1);
                render();
            }
            function render() {
                container.innerHTML = '';
                tags.forEach((tag, idx) => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'tag';
                    tagEl.innerHTML = `${tag} <span class="remove-tag" data-idx="${idx}">&times;</span>`;
                    container.appendChild(tagEl);
                });
                container.querySelectorAll('.remove-tag').forEach(btn => {
                    btn.onclick = () => removeTag(Number(btn.dataset.idx));
                });
            }
            return {
                get: () => tags.slice(),
                set: (arr) => { tags = arr.slice(); render(); }
            };
        }

                row.children[3].onclick = () => { awardsArr.splice(idx, 1); renderAwards(); };

                container.appendChild(row);
            });

            updateHiddenJson('awards', awardsArr);
        }

        document.getElementById('addAward').onclick = () => {
            const name = document.getElementById('awardName').value.trim();
            const year = document.getElementById('awardYear').value.trim();
            const description = document.getElementById('awardDesc').value.trim();

            if (name && year && description) {
                awardsArr.push({ name, year, description });
                renderAwards();
                document.getElementById('awardName').value = '';
                document.getElementById('awardYear').value = '';
                document.getElementById('awardDesc').value = '';
            }
        };

        // Load for update (if slug in URL)
        async function fetchCelebrity(slug) {
            try {
                const res = await fetch(`/api/celebrities/${slug}`);
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                return null;
            }
        }
        function fillForm(data) {
            document.getElementById('formTitle').textContent = 'Update Celebrity';
            document.getElementById('fullName').value = data.fullName || '';
            document.getElementById('stageName').value = data.stageName || data.nickname || '';
            document.getElementById('dateOfBirth').value = data.dateOfBirth ? data.dateOfBirth.split('T')[0] : '';
            document.getElementById('placeOfBirth').value = data.placeOfBirth || '';
            document.getElementById('nationality').value = data.nationality || '';
            document.getElementById('profession').value = data.roles ? data.roles.join(', ') : '';
            document.getElementById('bio').value = data.bio || '';
            document.getElementById('careerBackground').value = data.careerBackground || '';
            document.getElementById('careerStatus').value = data.careerStatus || '';
            document.getElementById('careerStart').value = data.careerStart || '';
            document.getElementById('careerBreakthrough').value = data.careerBreakthrough || '';
            document.getElementById('link').value = data.link || '';
            achievementsArr = data.careerAchievements || [];
            renderCareerAchievements();
            timelineArr = (data.careerTimeline || []);
            renderTimeline();
            albumsArr = (data.albums || []);
            renderAlbums();
            concertsArr = (data.concerts || []);
            renderConcerts();
            brandsArr = (data.brands || []);
            renderBrands();
            awardsArr = (data.awards || []);
            renderAwards();
            nominationsArr = (data.nominations || []);
            renderNominations();
            recordsArr = (data.records || []);
            renderRecords();
            awardGalleryArr = (data.awardGallery || []);
            renderAwardGallery();
            document.getElementById('relationshipStatus').value = data.relationshipStatus || '';
            document.getElementById('children').value = (data.children || []).join(', ') || '';
            document.getElementById('family').value = data.family || '';
            document.getElementById('friends').value = (data.friends || []).join(', ') || '';
            personalInsightsArr = data.personalInsights || [];
            renderPersonalInsights();
            const netWorth = parseFloat(data.networth);
            document.getElementById('networth').value = isNaN(netWorth) ? 0 : netWorth.toFixed(2);

            assetsArr = data.assets || [];
            renderAssets();
            philanthropyArr = data.philanthropy || [];
            renderPhilanthropy();
            newsTag.set(data.news || []);
            funFactsArr = data.funFacts || [];
            renderFunFacts();
            if (data.profilePic) {
                document.getElementById('profileImgPreview').src = data.profilePic;
                document.getElementById('profilePic').value = data.profilePic;
            }
            if (data.coverPic) {
                document.getElementById('coverImgPreview').src = data.coverPic;
                document.getElementById('coverPic').value = data.coverPic;
            }
        }
        // On load, check for slug
        let slug = null;
        document.addEventListener('DOMContentLoaded', async function () {
            slug = new URLSearchParams(window.location.search).get('slug') || null;
            if (slug) {
                const data = await fetchCelebrity(slug);
                if (data) fillForm(data);
            }

            document.querySelectorAll('textarea').forEach(textarea => {
                const autoResize = () => {
                    textarea.style.height = 'auto';
                    textarea.style.height = `${textarea.scrollHeight}px`;
                };
                textarea.addEventListener('input', autoResize);
                autoResize(); // initial size
            });

        });




        document.getElementById('celebrityForm').onsubmit = async function (e) {
            e.preventDefault();
            document.getElementById('formAlert').innerHTML = '';

            const form = e.target;
            const formData = new FormData(form);

            let imageUrl = formData.get('profilePic'); // May already have a URL

            const fileInput = document.getElementById('ProfileImage');
            if (fileInput.files.length) {
                try {
                    const uploadFormData = new FormData();
                    uploadFormData.append('image', fileInput.files[0]);

                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        body: uploadFormData
                    });

                    if (!res.ok) throw new Error('Upload failed');

                    const data = await res.json();
                    console.log('Server response:', data);

                    // Extract URL from response
                    imageUrl = data.url?.path || data.url?.secure_url || data.url;
                    formData.set('profilePic', imageUrl);
                    document.getElementById('profileImgPreview').src = imageUrl;

                    // Also show it in the input field for user visibility
                    const profilePicInput = document.querySelector('input[name="profilePic"]');
                    if (profilePicInput) {
                        profilePicInput.value = imageUrl;
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById('formAlert').textContent = 'Image upload failed!';
                    return;
                }
            }

            // Prepare JSON payload
            const payload = {
                fullName: formData.get('fullName'),
                nickname: formData.get('stageName'),
                dateOfBirth: formData.get('dateOfBirth'),
                profilePic: imageUrl,
                coverPic: formData.get('coverPic'),
                placeOfBirth: formData.get('placeOfBirth'),
                nationality: formData.get('nationality'),
                roles: formData.get('profession').split(',').map(r => r.trim()).filter(Boolean),
                link: formData.get('link'),
                bio: formData.get('bio'),
                careerBackground: formData.get('careerBackground'),
                careerStatus: formData.get('careerStatus'),
                careerStart: formData.get('careerStart'),
                careerBreakthrough: formData.get('careerBreakthrough'),
                careerAchievements: achievementsArr,
                careerTimeline: timelineArr,
                albums: albumsArr,
                concerts: concertsArr,
                brands: brandsArr,
                awards: awardsArr,
                nominations: nominationsArr,
                records: recordsArr,
                awardGallery: awardGalleryArr,
                relationshipStatus: formData.get('relationshipStatus'),
                children: formData.get('children').split(',').map(c => c.trim()).filter(Boolean),
                family: formData.get('family'),
                friends: formData.get('friends').split(',').map(f => f.trim()).filter(Boolean),
                personalInsights: personalInsightsArr,
                networth: formData.get('networth'),
                assets: assetsArr,
                philanthropy: philanthropyArr,
                news: newsTag.get(),
                funFacts: funFactsArr
            };
            // Submit
            document.getElementById('submitBtn').disabled = true;
            try {
                const res = await fetch(slug ? `/api/celebrities/${slug}` : '/api/celebrities', {
                    method: slug ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    document.getElementById('formAlert').innerHTML = '<div class="alert alert-success">Celebrity saved successfully!</div>';
                    const datas = await res.json(); // ✅ await this

                    console.log('Celebrity saved:', datas);

                    if (datas.slug) {
                        // Update URL with new slug
                        slug = datas.slug || slug;

                        const url = new URL(window.location);
                        url.searchParams.set('slug', slug);
                        window.history.replaceState({}, '', url);

                        window.scrollTo({ top: 0, behavior: 'smooth' });

                    }
                    if (!slug) form.reset();
                } else {
                    const err = await res.json();
                    document.getElementById('formAlert').innerHTML = `<div class="alert alert-danger">${err.message || 'Failed to save.'}</div>`;
                }
            } catch (err) {
                document.getElementById('formAlert').innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            }
            document.getElementById('submitBtn').disabled = false;
        };

        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('profileImgPreview');

            if (file) {
                const reader = new FileReader();

                reader.onload = function (e) {
                    preview.src = e.target.result;
                };

                reader.readAsDataURL(file);
            }
        }

    </script>
</body>

</html>
