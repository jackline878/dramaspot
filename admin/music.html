            },
            // ... add more up to 100+ for demo
        ];

        // Generate more demo data for pagination
        for (let i = 11; i <= 100; i++) {
            musicData.push({
                slug: `song-${i}`,
                title: `Song Title ${i}`,
                artist: `Artist ${i % 10}`,
                genre: ["Pop", "Hip-Hop", "Alternative", "Country", "Rock", "Jazz"][i % 6],
                year: 2010 + (i % 15),
                thumbnail: `https://i.imgur.com/${(i % 10) + 1}.jpg`
            });
        }

        // Pagination and filtering variables
        let currentPage = 1;
        const itemsPerPage = 30;
        let filteredMusic = [...musicData];
        let currentSort = "title";
        let currentSearch = "";

        // Utility: Slugify a string
        function slugify(str) {
            return str.toString().toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '').replace(/\-\-+/g, '-').replace(/^-+/, '').replace(/-+$/, '');
        }

        // Render music table
        function renderMusicTable() {
            const tbody = document.getElementById('musicTableBody');
            tbody.innerHTML = '';
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = Math.min(startIdx + itemsPerPage, filteredMusic.length);
            for (let i = startIdx; i < endIdx; i++) {
                const music = filteredMusic[i];
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <a href="/admin/music/${music.slug}.html" class="music-link">
                            <img src="${music.thumbnail}" alt="${music.title} thumbnail" class="music-thumbnail" loading="lazy">
                        </a>
                    </td>
                    <td>
                        <a href="/admin/music/${music.slug}.html" class="music-link">
                            <span class="music-title">${music.title}</span>
                        </a>
                        <div class="music-meta d-block d-md-none">${music.artist}</div>
                    </td>
                    <td class="d-none d-md-table-cell">${music.artist}</td>
                    <td>
                        <span class="badge music-genre-badge">${music.genre}</span>
                    </td>
                    <td>
                        <span class="music-year">${music.year}</span>
                    </td>
                    <td class="text-end music-actions">
                        <a href="/admin/music/${music.slug}.html" class="btn btn-sm btn-outline-primary" title="View"><i class="bi bi-eye"></i></a>
                        <a href="/admin/music/edit/${music.slug}.html" class="btn btn-sm btn-outline-secondary" title="Edit"><i class="bi bi-pencil"></i></a>
                        <button class="btn btn-sm btn-outline-danger" title="Delete" onclick="deleteMusic('${music.slug}')"><i class="bi bi-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(row);
            }
            renderPagination();
            renderPaginationInfo();
        }

        // Render pagination
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            const totalPages = Math.ceil(filteredMusic.length / itemsPerPage);
            if (totalPages <= 1) return;

            function createPageItem(page, label, active = false, disabled = false) {
                const li = document.createElement('li');
                li.className = `page-item${active ? ' active' : ''}${disabled ? ' disabled' : ''}`;
                const a = document.createElement('a');
                a.className = 'page-link';
                a.href = '#';
                a.textContent = label;
                a.onclick = (e) => {
                    e.preventDefault();
                    if (!disabled && currentPage !== page) {
                        currentPage = page;
                        renderMusicTable();
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    }
                };
                li.appendChild(a);
                return li;
            }

            // Previous
            pagination.appendChild(createPageItem(currentPage - 1, '«', false, currentPage === 1));

            // Page numbers (show max 7)
            let start = Math.max(1, currentPage - 3);
            let end = Math.min(totalPages, currentPage + 3);
            if (currentPage <= 4) end = Math.min(7, totalPages);
            if (currentPage > totalPages - 4) start = Math.max(1, totalPages - 6);

            for (let i = start; i <= end; i++) {
                pagination.appendChild(createPageItem(i, i, i === currentPage));
            }

            // Next
            pagination.appendChild(createPageItem(currentPage + 1, '»', false, currentPage === totalPages));
        }

        // Render pagination info
        function renderPaginationInfo() {
            const info = document.getElementById('paginationInfo');
            if (filteredMusic.length === 0) {
                info.textContent = "No music found.";
                return;
            }
            const startIdx = (currentPage - 1) * itemsPerPage + 1;
            const endIdx = Math.min(currentPage * itemsPerPage, filteredMusic.length);
            info.textContent = `Showing ${startIdx}-${endIdx} of ${filteredMusic.length} tracks`;
        }

        // Search and filter
        function filterMusic() {
            const search = currentSearch.trim().toLowerCase();
            filteredMusic = musicData.filter(music =>
                music.title.toLowerCase().includes(search) ||
                music.artist.toLowerCase().includes(search) ||
                music.genre.toLowerCase().includes(search) ||
                music.year.toString().includes(search)
            );
            sortMusic();
        }

        // Sort music
        function sortMusic() {
            switch (currentSort) {
                case "title":
                    filteredMusic.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case "artist":
                    filteredMusic.sort((a, b) => a.artist.localeCompare(b.artist));
                    break;
                case "genre":
                    filteredMusic.sort((a, b) => a.genre.localeCompare(b.genre));
                    break;
                case "year_desc":
                    filteredMusic.sort((a, b) => b.year - a.year);
                    break;
                case "year_asc":
                    filteredMusic.sort((a, b) => a.year - b.year);
                    break;
            }
            currentPage = 1;
            renderMusicTable();
        }

        // Delete music (demo only)
        function deleteMusic(slug) {
            if (confirm("Are you sure you want to delete this music?")) {
                const idx = musicData.findIndex(m => m.slug === slug);
                if (idx !== -1) {
                    musicData.splice(idx, 1);
                    filterMusic();
                }
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', function() {
            currentSearch = this.value;
            filterMusic();
        });

        document.getElementById('sortSelect').addEventListener('change', function() {
            currentSort = this.value;
            sortMusic();
        });

        // Initial render
        filterMusic();

        // Responsive table for mobile
        window.addEventListener('resize', function() {
            renderMusicTable();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
